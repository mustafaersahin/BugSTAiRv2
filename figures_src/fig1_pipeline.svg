<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777777"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1700" height="620" fill="#ffffff"/>

  <!-- Bug report input -->
  <rect x="20" y="255" width="150" height="90" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="2"/>
  <text x="95" y="292" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="600">Bug</text>
  <text x="95" y="316" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="600">Report q</text>

  <!-- split arrows to B and D -->
  <path d="M170,300 L215,190" stroke="#333333" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M170,300 L215,410" stroke="#333333" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Lexical box B -->
  <rect x="220" y="115" width="330" height="150" rx="8" fill="#e0edff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="385" y="155" text-anchor="middle" font-size="21" fill="#1e3a8a" font-weight="700">Lexical Retrieval (B)</text>
  <text x="385" y="185" text-anchor="middle" font-size="16" fill="#1e3a8a">BM25 over path-symbols-</text>
  <text x="385" y="207" text-anchor="middle" font-size="16" fill="#1e3a8a">imports document</text>
  <text x="385" y="238" text-anchor="middle" font-size="15" fill="#3b5998" font-style="italic">produces ranking R_B</text>

  <!-- Dense box D -->
  <rect x="220" y="345" width="330" height="150" rx="8" fill="#e0edff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="385" y="385" text-anchor="middle" font-size="21" fill="#1e3a8a" font-weight="700">Dense Retrieval (D)</text>
  <text x="385" y="415" text-anchor="middle" font-size="16" fill="#1e3a8a">Code-embedding cosine</text>
  <text x="385" y="437" text-anchor="middle" font-size="16" fill="#1e3a8a">similarity</text>
  <text x="385" y="468" text-anchor="middle" font-size="15" fill="#3b5998" font-style="italic">produces ranking R_D</text>

  <!-- arrows to RRF -->
  <path d="M550,190 L640,270" stroke="#333333" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M550,420 L640,320" stroke="#333333" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- RRF box -->
  <rect x="650" y="255" width="230" height="110" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="765" y="300" text-anchor="middle" font-size="20" fill="#78350f" font-weight="700">RRF Fusion</text>
  <text x="765" y="325" text-anchor="middle" font-size="16" fill="#78350f">k = 60</text>
  <text x="765" y="348" text-anchor="middle" font-size="14" fill="#92400e" font-style="italic">unfitted default</text>

  <!-- arrow to H -->
  <path d="M880,310 L960,310" stroke="#333333" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Hybrid H box -->
  <rect x="965" y="245" width="220" height="130" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
  <text x="1075" y="290" text-anchor="middle" font-size="21" fill="#14532d" font-weight="700">Hybrid H</text>
  <text x="1075" y="318" text-anchor="middle" font-size="15" fill="#14532d">frozen ranking</text>
  <text x="1075" y="340" text-anchor="middle" font-size="15" fill="#14532d">(input to reranking)</text>

  <!-- arrow to LLM reranking -->
  <path d="M1185,310 L1265,310" stroke="#333333" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="1225" y="298" text-anchor="middle" font-size="13" fill="#555555">top-100</text>

  <!-- LLM reranking box -->
  <rect x="1270" y="215" width="290" height="190" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="1415" y="253" text-anchor="middle" font-size="20" fill="#7f1d1d" font-weight="700">Bounded LLM</text>
  <text x="1415" y="277" text-anchor="middle" font-size="20" fill="#7f1d1d" font-weight="700">Reranking (SR)</text>
  <text x="1415" y="305" text-anchor="middle" font-size="15" fill="#7f1d1d">Qwen3-8B, greedy decode</text>
  <text x="1415" y="327" text-anchor="middle" font-size="15" fill="#7f1d1d">per-candidate relevance</text>
  <text x="1415" y="349" text-anchor="middle" font-size="15" fill="#7f1d1d">scoring, no ground truth</text>
  <text x="1415" y="380" text-anchor="middle" font-size="13" fill="#991b1b" font-style="italic">ranks &gt;100 never considered</text>

  <!-- arrow to H+SR -->
  <path d="M1415,405 L1415,470" stroke="#333333" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- fail-safe dashed branch: bypasses reranking directly into H+SR output -->
  <path d="M1075,376 C1075,470 1075,560 1075,560 C1075,560 1200,560 1290,545"
        stroke="#777777" stroke-width="2" fill="none" stroke-dasharray="7,5" marker-end="url(#arrowDashed)"/>
  <text x="1075" y="588" text-anchor="middle" font-size="14" fill="#555555" font-style="italic">fail-safe: unparseable candidate keeps its H rank directly in H+SR</text>

  <!-- H+SR output box -->
  <rect x="1290" y="475" width="270" height="100" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2.5"/>
  <text x="1425" y="513" text-anchor="middle" font-size="21" fill="#3b0764" font-weight="700">H+SR</text>
  <text x="1425" y="538" text-anchor="middle" font-size="15" fill="#3b0764">Final Ranked Output</text>
  <text x="1425" y="558" text-anchor="middle" font-size="13" fill="#4c1d95" font-style="italic">every candidate appears exactly once</text>

  <text x="850" y="30" text-anchor="middle" font-size="15" fill="#666666">Repository snapshot frozen at the commit immediately preceding the fix (shared corpus for B, D)</text>
</svg>
